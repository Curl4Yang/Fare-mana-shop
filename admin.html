<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Fare Mana</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  /* Styles propres à cette page privée uniquement — n'affecte aucune
     autre page du site. */
  body{background:var(--cream);min-height:100vh;}
  .admin-wrap{max-width:720px;margin:0 auto;padding:70px 24px 100px;}
  .admin-login{max-width:380px;margin:80px auto;padding:36px;text-align:center;}
  .admin-review-card{padding:24px 26px;margin-bottom:18px;}
  .admin-review-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .admin-review-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .admin-empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;}
</style>
</head>
<body>

<div id="admin-login-view" class="admin-wrap">
  <div class="card admin-login">
    <p class="eyebrow" style="margin-bottom:6px;">Fare Mana</p>
    <h1 class="section-title" style="font-size:24px;margin-bottom:22px;">Administration</h1>
    <form id="admin-login-form" novalidate>
      <div class="field" style="margin-bottom:16px;">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" required autocomplete="username">
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label for="admin-password">Mot de passe</label>
        <input type="password" id="admin-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Se connecter</button>
      <p class="form-note" id="admin-login-status"></p>
    </form>
  </div>
</div>

<div id="admin-main-view" class="admin-wrap" style="display:none;">
  <div class="admin-topbar">
    <div>
      <p class="eyebrow" style="margin-bottom:2px;">Fare Mana — Administration</p>
      <h1 class="section-title" style="font-size:24px;">Avis publiés</h1>
    </div>
    <button type="button" class="btn btn-ghost btn-sm" id="admin-logout">Se déconnecter</button>
  </div>
  <div id="admin-reviews-list"></div>
</div>

<script src="assets/js/data.js"></script>
<script>
(function () {
  "use strict";
  const DATA = window.FareManaData;
  const SB_URL = DATA.supabase.url;
  const SB_KEY = DATA.supabase.anonKey;
  const configured = SB_URL && SB_KEY && SB_URL !== "SUPABASE_URL_TODO" && SB_KEY !== "SUPABASE_ANON_KEY_TODO";
  const TOKEN_KEY = "fareManaAdminToken";

  const loginView = document.getElementById("admin-login-view");
  const mainView = document.getElementById("admin-main-view");
  const loginForm = document.getElementById("admin-login-form");
  const loginStatus = document.getElementById("admin-login-status");
  const listEl = document.getElementById("admin-reviews-list");

  if (!configured) {
    loginForm.querySelector("button").disabled = true;
    loginStatus.style.color = "var(--danger)";
    loginStatus.textContent = "Supabase n'est pas encore configuré (voir SUPABASE-SETUP.md). Cet espace ne peut pas fonctionner tant que le projet n'est pas relié.";
    return;
  }

  function getToken() {
    try { return JSON.parse(sessionStorage.getItem(TOKEN_KEY) || "null"); } catch (e) { return null; }
  }
  function setToken(session) {
    try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify(session)); } catch (e) { /* ignore */ }
  }
  function clearToken() {
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* ignore */ }
  }

  function showMain() { loginView.style.display = "none"; mainView.style.display = ""; loadReviews(); }
  function showLogin() { mainView.style.display = "none"; loginView.style.display = ""; }

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("admin-email").value;
    const password = document.getElementById("admin-password").value;
    loginStatus.style.color = "var(--ink-soft)";
    loginStatus.textContent = "Connexion…";
    // Authentification RÉELLE via l'API Supabase Auth (aucun mot de passe
    // stocké ou vérifié côté JavaScript) : c'est Supabase qui valide les
    // identifiants et renvoie un jeton de session en cas de succès.
    fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    })
      .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (!ok || !data.access_token) throw new Error(data.error_description || "auth failed");
        setToken(data);
        loginStatus.textContent = "";
        showMain();
      })
      .catch(() => {
        loginStatus.style.color = "var(--danger)";
        loginStatus.textContent = "Identifiants incorrects, ou compte non configuré.";
      });
  });

  document.getElementById("admin-logout").addEventListener("click", () => {
    clearToken();
    showLogin();
  });

  function loadReviews() {
    const session = getToken();
    if (!session) { showLogin(); return; }
    listEl.innerHTML = '<p class="admin-empty">Chargement…</p>';
    fetch(`${SB_URL}/rest/v1/reviews?select=*&order=created_at.desc`, {
      headers: { apikey: SB_KEY, Authorization: `Bearer ${session.access_token}` },
    })
      .then((res) => {
        if (res.status === 401) { clearToken(); showLogin(); throw new Error("unauthorized"); }
        return res.json();
      })
      .then((reviews) => {
        if (!reviews.length) { listEl.innerHTML = '<p class="admin-empty">Aucun avis pour le moment.</p>'; return; }
        listEl.innerHTML = reviews.map((r) => `
          <div class="card admin-review-card" data-review-id="${r.id}">
            <div class="admin-review-top">
              <div>
                <div style="color:var(--gold);letter-spacing:2px;">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</div>
                <p style="margin:8px 0;">“${escapeHtml(r.review_text)}”</p>
                <p class="admin-review-meta">${escapeHtml(r.first_name)} — ${r.destination === "bora" ? "Bora Bora" : "Marseille & environs"}${r.treatment ? " · " + escapeHtml(r.treatment) : ""}</p>
                <p class="admin-review-meta">Reçu le ${new Date(r.created_at).toLocaleDateString("fr-FR")} · e-mail privé : ${escapeHtml(r.email_private)}</p>
              </div>
              <button type="button" class="btn btn-ghost btn-sm" data-delete-review="${r.id}">Supprimer</button>
            </div>
          </div>`).join("");
        listEl.querySelectorAll("[data-delete-review]").forEach((btn) => {
          btn.addEventListener("click", () => deleteReview(btn.getAttribute("data-delete-review")));
        });
      });
  }

  function deleteReview(id) {
    if (!confirm("Supprimer définitivement cet avis du site ?")) return;
    const session = getToken();
    fetch(`${SB_URL}/rest/v1/reviews?id=eq.${id}`, {
      method: "DELETE",
      headers: { apikey: SB_KEY, Authorization: `Bearer ${session.access_token}` },
    }).then((res) => {
      if (res.ok) {
        const card = listEl.querySelector(`[data-review-id="${id}"]`);
        if (card) card.remove();
      } else {
        alert("La suppression a échoué. Réessayez.");
      }
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  if (getToken()) showMain(); else showLogin();
})();
</script>
</body>
</html>
